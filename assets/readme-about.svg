<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="182" viewBox="0 0 900 182">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
  </defs>
  <rect width="900" height="182" rx="16" fill="url(#bg)" stroke="#30363D"/>
  <rect x="0" y="0" width="6" height="182" fill="#26A5E4"/>
  <text x="36" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">О проекте</text>
  
  <text x="36" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#C9D1D9">Этот бот позволяет проводить аукционы прямо в Telegram-группах и</text>
<text x="36" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#C9D1D9">супергруппах (включая форумы с темами). Он полностью готов к</text>
<text x="36" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#C9D1D9">использованию: все зависимости устанавливаются автоматически при первом</text>
<text x="36" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#C9D1D9">запуске.</text>

